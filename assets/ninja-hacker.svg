<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#063306"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#39FF14" flood-opacity="0.75"/>
  </filter>
  <filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="card"><rect width="800" height="220" rx="16"/></clipPath>
</defs>
<style>
  .lines line { stroke:#39FF14; stroke-linecap:round; animation: zip 0.9s linear infinite; }
  .lines line:nth-child(2) { animation-duration:0.7s; animation-delay:-0.3s; }
  .lines line:nth-child(3) { animation-duration:1.1s; animation-delay:-0.6s; }
  .lines line:nth-child(4) { animation-duration:0.8s; animation-delay:-0.2s; }
  .lines line:nth-child(5) { animation-duration:1.0s; animation-delay:-0.75s; }
  .lines line:nth-child(6) { animation-duration:0.65s; animation-delay:-0.45s; }
  @keyframes zip { from { transform: translateX(900px); } to { transform: translateX(-300px); } }
  .ground { stroke:#39FF14; stroke-width:2; stroke-dasharray:24 18; opacity:.55; animation: run 0.42s linear infinite; }
  @keyframes run { to { stroke-dashoffset: 42; } }
  .body { animation: bob 0.3s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  .legA { transform-origin: 400px 118px; animation: stride 0.6s ease-in-out infinite alternate; }
  .legB { transform-origin: 400px 118px; animation: stride 0.6s ease-in-out infinite alternate-reverse; }
  @keyframes stride { from { transform: rotate(-42deg); } to { transform: rotate(38deg); } }
  .armA { transform-origin: 413px 86px; animation: swing 0.6s ease-in-out infinite alternate-reverse; }
  .armB { transform-origin: 413px 86px; animation: swing 0.6s ease-in-out infinite alternate; }
  @keyframes swing { from { transform: rotate(-50deg); } to { transform: rotate(45deg); } }
  .shadow { animation: shad 0.3s ease-in-out infinite alternate; transform-origin: 405px 170px; }
  @keyframes shad { from { transform: scaleX(1); opacity:.45; } to { transform: scaleX(.8); opacity:.3; } }
  .slash { stroke:#39FF14; stroke-width:5; fill:none; stroke-linecap:round;
           stroke-dasharray:190; stroke-dashoffset:190; opacity:0; animation: slash 3s ease-out infinite; }
  @keyframes slash { 0%,70% { stroke-dashoffset:190; opacity:0; } 72% { opacity:1; }
                     80% { stroke-dashoffset:0; opacity:1; } 92%,100% { stroke-dashoffset:-190; opacity:0; } }
  .spark { fill:#39FF14; opacity:0; animation: spark 3s ease-out infinite; transform-origin: 505px 92px; }
  @keyframes spark { 0%,76% { opacity:0; transform: scale(.2); } 80% { opacity:1; transform: scale(1.1); } 90%,100% { opacity:0; transform: scale(1.6); } }
</style>
<g clip-path="url(#card)">
  <rect width="800" height="220" fill="url(#bg)"/>
  <g class="lines" opacity=".35">
    <line x1="0" y1="40"  x2="90"  y2="40"  stroke-width="2"/>
    <line x1="0" y1="62"  x2="140" y2="62"  stroke-width="1.5"/>
    <line x1="0" y1="95"  x2="70"  y2="95"  stroke-width="2.5"/>
    <line x1="0" y1="128" x2="120" y2="128" stroke-width="1.5"/>
    <line x1="0" y1="148" x2="60"  y2="148" stroke-width="2"/>
    <line x1="0" y1="78"  x2="180" y2="78"  stroke-width="1"/>
  </g>
  <line class="ground" x1="0" y1="190" x2="800" y2="190"/>
  <g transform="translate(400 190) scale(1.3) translate(-405 -170)">
  <ellipse class="shadow" cx="405" cy="170" rx="30" ry="4" fill="#000"/>

  <g class="body" filter="url(#glow)">
    <path fill="#39FF14" opacity=".95">
      <animate attributeName="d" dur="0.5s" repeatCount="indefinite"
        values="M410 80 C385 72 365 84 335 70 L330 78 C362 92 385 82 410 88 Z;M410 80 C385 82 360 68 332 80 L330 89 C360 78 385 92 410 88 Z;M410 80 C385 72 365 84 335 70 L330 78 C362 92 385 82 410 88 Z"/>
    </path>
    <g class="legB" stroke="#07070b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M400 118 L398 142 L394 164"/>
    </g>
    <g class="armB" stroke="#07070b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M413 86 L410 104 L418 116"/>
    </g>
    <line x1="388" y1="74" x2="436" y2="122" stroke="#07070b" stroke-width="4" stroke-linecap="round"/>
    <line x1="381" y1="67" x2="392" y2="78" stroke="#39FF14" stroke-width="5" stroke-linecap="round"/>
    <path d="M400 120 L414 84" stroke="#07070b" stroke-width="16" stroke-linecap="round"/>
    <path d="M394 112 L410 117" stroke="#39FF14" stroke-width="3" stroke-linecap="round"/>
    <path d="M404 62 Q408 46 422 48 Q436 52 432 66 Q430 78 418 78 Q404 76 404 62 Z" fill="#07070b"/>
    <path d="M406 56 L392 60 L405 64 Z" fill="#07070b"/>
    <rect x="417" y="59" width="13" height="3.2" rx="1.6" fill="#39FF14" filter="url(#bigglow)"/>
    <g class="legA" stroke="#07070b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M400 118 L398 142 L394 164"/>
    </g>
    <g class="armA" stroke="#07070b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M413 86 L416 104 L428 110"/>
    </g>
  </g>

  <g transform="translate(0 25)">
  <path class="slash" d="M462 140 Q520 120 540 50" filter="url(#bigglow)"/>
  <g class="spark">
    <path d="M505 80 L508 89 L517 92 L508 95 L505 104 L502 95 L493 92 L502 89 Z"/>
  </g>
  </g>
  </g>
</g>
</svg>
